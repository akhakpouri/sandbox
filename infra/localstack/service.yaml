apiVersion: v1
kind: Service
metadata:
  name: localstack-service
  namespace: infra
spec:
  type: NodePort
  selector:
    app: localstack-app
  ports:
    - name: internal
      protocol: TCP
      port: 4566
      targetPort: 4566
    - name: external
      protocol: TCP
      port: 4510
      targetPort: 4510
