apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-app
  namespace: infra
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379

    maxmemory 250mb
    appendonly yes
    appendfsync everysec

    save 60 1000

    loglevel notice
    logfile ""

    slowlog-log-slower-than 10000
    slowlog-max-len 128
